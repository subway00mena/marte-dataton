<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARES-PATH | Simulador de Dispositivos (Celular, Tablet, Laptop y TV)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #08090d;
            color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .barra-dispositivos {
            background: #120804;
            border-bottom: 2px solid #ff5500;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 100;
        }

        .titulo-simulador {
            font-size: 14px;
            font-weight: bold;
            color: #ff5500;
            letter-spacing: 0.5px;
        }

        .titulo-simulador span {
            color: #00ffff;
            font-size: 12px;
            margin-left: 8px;
        }

        .grupo-botones {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-disp {
            background: rgba(255, 85, 0, 0.12);
            border: 1px solid #ff5500;
            color: #ffaa66;
            padding: 6px 11px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-disp:hover {
            background: rgba(255, 85, 0, 0.35);
            color: #ffffff;
        }

        .btn-disp.activo {
            background: #ff5500;
            color: #000000;
            box-shadow: 0 0 12px rgba(255, 85, 0, 0.7);
        }

        .area-trabajo {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            overflow: auto;
            background:
                radial-gradient(circle at center, rgba(255, 85, 0, 0.07) 0%, transparent 70%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 24px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 24px);
        }

        .marco-equipo {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .etiqueta-marco {
            margin-bottom: 8px;
            font-size: 11px;
            color: #00ffff;
            background: rgba(0, 30, 40, 0.85);
            border: 1px solid #00d4ff;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .carcasa {
            position: relative;
            background: #000000;
            border: 10px solid #22252a;
            border-radius: 24px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 0 2px #ff5500;
            overflow: hidden;
            transition: width 0.3s ease, height 0.3s ease, transform 0.3s ease;
        }

        .carcasa iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #050508;
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="barra-dispositivos">
        <div class="titulo-simulador">
            PROBADOR MULTIDISPOSITIVO ARES-PATH
            <span id="info-resolucion">[MODO: CELULAR + TABLET SIMULTANEOS]</span>
        </div>

        <div class="grupo-botones">
            <button class="btn-disp activo" onclick="cambiarModo('simultaneo', this)">
                CELULAR + TABLET (JUNTOS)
            </button>
            <button class="btn-disp" onclick="cambiarModo('celular-v', this)">
                CELULAR VERTICAL (390x844)
            </button>
            <button class="btn-disp" onclick="cambiarModo('celular-h', this)">
                CELULAR HORIZONTAL (844x390)
            </button>
            <button class="btn-disp" onclick="cambiarModo('tablet-v', this)">
                TABLET VERTICAL (768x1024)
            </button>
            <button class="btn-disp" onclick="cambiarModo('tablet-h', this)">
                TABLET HORIZONTAL (1024x768)
            </button>
            <button class="btn-disp" onclick="cambiarModo('laptop', this)">
                LAPTOP (1366x768)
            </button>
            <button class="btn-disp" onclick="cambiarModo('tv', this)">
                TELEVISION 4K (2560x1440)
            </button>
        </div>
    </div>

    <div id="contenedor-frames" class="area-trabajo">
        <!-- Marco 1: Principal / Celular en vista simultanea -->
        <div id="marco-1" class="marco-equipo">
            <div id="label-1" class="etiqueta-marco">CELULAR (375 x 740 px)</div>
            <div id="carcasa-1" class="carcasa" style="width: 375px; height: 740px;">
                <iframe src="Archivo1.html" title="Vista Dispositivo 1"></iframe>
            </div>
        </div>

        <!-- Marco 2: Tablet en vista simultanea -->
        <div id="marco-2" class="marco-equipo">
            <div id="label-2" class="etiqueta-marco">TABLET (820 x 740 px)</div>
            <div id="carcasa-2" class="carcasa" style="width: 820px; height: 740px; border-radius: 16px;">
                <iframe src="Archivo1.html" title="Vista Dispositivo 2"></iframe>
            </div>
        </div>
    </div>

    <script>
        function cambiarModo(modo, btn) {
            document.querySelectorAll('.btn-disp').forEach(b => b.classList.remove('activo'));
            if (btn) btn.classList.add('activo');

            const marco1 = document.getElementById('marco-1');
            const carcasa1 = document.getElementById('carcasa-1');
            const label1 = document.getElementById('label-1');

            const marco2 = document.getElementById('marco-2');
            const info = document.getElementById('info-resolucion');

            carcasa1.style.transform = 'none';
            marco1.style.margin = '0';

            if (modo === 'simultaneo') {
                marco2.classList.remove('oculto');
                carcasa1.style.width = '375px';
                carcasa1.style.height = '740px';
                carcasa1.style.borderRadius = '24px';
                label1.innerText = 'CELULAR (375 x 740 px)';
                info.innerText = '[MODO: CELULAR + TABLET SIMULTANEOS]';
            } else {
                marco2.classList.add('oculto');

                if (modo === 'celular-v') {
                    carcasa1.style.width = '390px';
                    carcasa1.style.height = '844px';
                    carcasa1.style.borderRadius = '28px';
                    label1.innerText = 'CELULAR VERTICAL - iPhone / Android (390 x 844 px)';
                    info.innerText = '[RESOLUCION: 390 x 844 px]';
                } else if (modo === 'celular-h') {
                    carcasa1.style.width = '844px';
                    carcasa1.style.height = '390px';
                    carcasa1.style.borderRadius = '24px';
                    label1.innerText = 'CELULAR HORIZONTAL - Landscape (844 x 390 px)';
                    info.innerText = '[RESOLUCION: 844 x 390 px]';
                } else if (modo === 'tablet-v') {
                    carcasa1.style.width = '768px';
                    carcasa1.style.height = '1024px';
                    carcasa1.style.borderRadius = '18px';
                    carcasa1.style.transform = 'scale(0.76)';
                    label1.innerText = 'TABLET VERTICAL - iPad (768 x 1024 px)';
                    info.innerText = '[RESOLUCION: 768 x 1024 px]';
                } else if (modo === 'tablet-h') {
                    carcasa1.style.width = '1024px';
                    carcasa1.style.height = '768px';
                    carcasa1.style.borderRadius = '18px';
                    label1.innerText = 'TABLET HORIZONTAL - iPad / Android Tab (1024 x 768 px)';
                    info.innerText = '[RESOLUCION: 1024 x 768 px]';
                } else if (modo === 'laptop') {
                    carcasa1.style.width = '1366px';
                    carcasa1.style.height = '768px';
                    carcasa1.style.borderRadius = '12px';
                    carcasa1.style.transform = 'scale(0.85)';
                    label1.innerText = 'LAPTOP ESTANDAR (1366 x 768 px)';
                    info.innerText = '[RESOLUCION: 1366 x 768 px]';
                } else if (modo === 'tv') {
                    carcasa1.style.width = '2560px';
                    carcasa1.style.height = '1440px';
                    carcasa1.style.borderRadius = '8px';
                    carcasa1.style.transform = 'scale(0.48)';
                    label1.innerText = 'TELEVISION 4K / ULTRA HD (2560 x 1440 px - Escalado 48% para caber en tu monitor)';
                    info.innerText = '[RESOLUCION: 2560 x 1440 px]';
                }
            }
        }
    </script>
</body>
</html>
